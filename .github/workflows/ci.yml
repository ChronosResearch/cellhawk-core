name: CellHawk CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  # Pin toolchain via rust-toolchain.toml; this env var is a fallback
  RUSTFLAGS: "-D warnings"

jobs:
  # ───────────────────────────────────────────────────────────────────────────
  # Rust: Format → Lint → Test
  # ───────────────────────────────────────────────────────────────────────────
  rust:
    name: Rust (${{ matrix.profile }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        profile: [debug, release]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust stable toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      # Cache: Cargo registry + compiled deps keyed on Cargo.lock
      - name: Cache Cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: cargo-registry-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: cargo-registry-

      - name: Cache Cargo build artefacts
        uses: actions/cache@v4
        with:
          path: target
          key: cargo-target-${{ matrix.profile }}-${{ hashFiles('**/Cargo.lock') }}-${{ hashFiles('crates/**/*.rs') }}
          restore-keys: |
            cargo-target-${{ matrix.profile }}-${{ hashFiles('**/Cargo.lock') }}-
            cargo-target-${{ matrix.profile }}-

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Clippy (all features, deny warnings)
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Run tests (${{ matrix.profile }})
        run: |
          if [ "${{ matrix.profile }}" = "release" ]; then
            cargo test --release --all
          else
            cargo test --all
          fi

      - name: Compile handover benchmark (smoke-check)
        if: matrix.profile == 'release'
        run: cargo bench --bench handover -p cellhawk-ekf --no-run

  # ───────────────────────────────────────────────────────────────────────────
  # Python: Lint → Type-check → PyO3 build → Test
  # ───────────────────────────────────────────────────────────────────────────
  python:
    name: Python 3.11
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # Rust toolchain needed for maturin to build the PyO3 extension
      - name: Install Rust stable toolchain
        uses: dtolnay/rust-toolchain@stable

      # Cache: pip packages keyed on requirements hash
      - name: Cache pip packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ hashFiles('requirements.txt') }}
          restore-keys: pip-

      - name: Cache Cargo build artefacts (PyO3)
        uses: actions/cache@v4
        with:
          path: target
          key: cargo-pyo3-${{ hashFiles('**/Cargo.lock') }}-${{ hashFiles('crates/**/*.rs') }}
          restore-keys: cargo-pyo3-

      - name: Install dependencies
        run: |
          python3.11 -m pip install --upgrade pip
          python3.11 -m pip install -r requirements.txt
          python3.11 -m pip install maturin

      # Build and install the PyO3 extension into the current venv
      - name: Build PyO3 extension (cellhawk_pyo3)
        run: |
          maturin build \
            --manifest-path crates/cellhawk-pyo3/Cargo.toml \
            --interpreter python3.11 \
            --release
          pip install target/wheels/cellhawk-*.whl --force-reinstall

      - name: Ruff lint
        run: python3.11 -m ruff check python/ tests/

      - name: Ruff format check
        run: python3.11 -m ruff format --check python/ tests/

      - name: Mypy type check
        run: python3.11 -m mypy python/

      - name: Pytest with coverage
        run: |
          python3.11 -m pytest tests/ \
            --cov=python \
            --cov-report=xml \
            --cov-report=term-missing \
            -v

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: coverage.xml

  # ───────────────────────────────────────────────────────────────────────────
  # Frontend: TypeScript type-check + Vitest unit tests
  # ───────────────────────────────────────────────────────────────────────────
  frontend:
    name: Frontend (Node 18)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node 18
        uses: actions/setup-node@v4
        with:
          node-version: "18"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: frontend

      - name: TypeScript type-check
        run: npx tsc --noEmit
        working-directory: frontend

      - name: Vitest unit tests
        run: npm test
        working-directory: frontend

  # ───────────────────────────────────────────────────────────────────────────
  # Protobuf: Validate schema compiles
  # ───────────────────────────────────────────────────────────────────────────
  proto:
    name: Protobuf validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install protoc
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y protobuf-compiler

      - name: Compile proto schema
        run: protoc --proto_path=proto proto/telemetry.proto --descriptor_set_out=/dev/null

  # ───────────────────────────────────────────────────────────────────────────
  # Config: Validate YAML files are well-formed
  # ───────────────────────────────────────────────────────────────────────────
  config:
    name: Config validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Validate YAML configs
        run: |
          python3.11 - <<'EOF'
          import yaml, sys, pathlib
          errors = []
          for f in pathlib.Path("config").glob("*.yaml"):
              try:
                  yaml.safe_load(f.read_text())
                  print(f"  ✓ {f.name}")
              except yaml.YAMLError as e:
                  errors.append(f"  ✗ {f.name}: {e}")
          if errors:
              print("\n".join(errors), file=sys.stderr)
              sys.exit(1)
          EOF

  # ───────────────────────────────────────────────────────────────────────────
  # Gate: All jobs must pass before merge
  # ───────────────────────────────────────────────────────────────────────────
  all-checks:
    name: All checks passed
    runs-on: ubuntu-latest
    needs: [rust, python, frontend, proto, config]
    if: always()
    steps:
      - name: Check all jobs succeeded
        run: |
          if [[ "${{ needs.rust.result }}"     != "success" ||
                "${{ needs.python.result }}"   != "success" ||
                "${{ needs.frontend.result }}" != "success" ||
                "${{ needs.proto.result }}"    != "success" ||
                "${{ needs.config.result }}"   != "success" ]]; then
            echo "One or more CI jobs failed."
            exit 1
          fi
          echo "All CI checks passed."
