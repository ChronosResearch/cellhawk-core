[build-system]
requires      = ["hatchling"]
build-backend = "hatchling.build"

[project]
name        = "cellhawk"
version     = "0.1.0"
description = "CellHawk: Triply-Redundant Navigation for GPS-Denied Environments"
authors     = [{ name = "Shashank Kumar", email = "shashankchoudhary792@gmail.com" }]
license     = { text = "MIT" }
readme      = "README.md"
requires-python = ">=3.11"

dependencies = [
    # API layer
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.0",
    "websockets>=12.0",
    # Async task queue
    "celery[redis]>=5.4.0",
    # Redis client
    "redis[hiredis]>=5.0.0",
    # Serialization
    "protobuf>=5.27.0",
    "pydantic>=2.7.0",
    # AI / ML
    "torch>=2.3.0",
    "numpy>=1.26.0",
    # Configuration
    "pyyaml>=6.0.1",
    # Observability
    "structlog>=24.2.0",
    "prometheus-client>=0.20.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "httpx>=0.27.0",       # async test client for FastAPI
    "ruff>=0.4.0",
    "mypy>=1.10.0",
    "types-PyYAML>=6.0.12",
    "types-redis>=4.6.0",
]

[tool.hatch.build.targets.wheel]
packages = ["python/cortex", "python/gcs", "python/slam"]

# ─── Ruff (linter + formatter) ───────────────────────────────────────────────
[tool.ruff]
line-length    = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "ANN", "B", "SIM"]
ignore = ["ANN101", "ANN102"]

# ─── Mypy ────────────────────────────────────────────────────────────────────
[tool.mypy]
python_version         = "3.11"
strict                 = true
ignore_missing_imports = true

# ─── Pytest ──────────────────────────────────────────────────────────────────
[tool.pytest.ini_options]
testpaths    = ["tests", "python"]
asyncio_mode = "auto"
addopts      = "--cov=python --cov-report=term-missing --cov-fail-under=80"
