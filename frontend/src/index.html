<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CellHawk Digital Twin</title>
  <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.3.2/dist/maplibre-gl.css" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: system-ui, sans-serif; background: #0f172a; color: #f1f5f9; }

    #map {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
    }

    #overlay-canvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
    }

    #hud {
      position: absolute;
      top: 12px;
      left: 12px;
      background: rgba(15, 23, 42, 0.85);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 8px;
      padding: 12px 16px;
      min-width: 200px;
      backdrop-filter: blur(8px);
      z-index: 10;
    }

    #hud h1 {
      font-size: 14px;
      font-weight: 700;
      letter-spacing: 0.05em;
      color: #38bdf8;
      margin-bottom: 8px;
    }

    .tier-legend {
      display: flex;
      flex-direction: column;
      gap: 4px;
      font-size: 12px;
    }

    .tier-item {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .tier-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      flex-shrink: 0;
    }
  </style>
</head>
<body>
  <div id="map"></div>
  <canvas id="overlay-canvas"></canvas>

  <div id="hud">
    <h1>⬡ CellHawk Digital Twin</h1>
    <div class="tier-legend">
      <div class="tier-item">
        <div class="tier-dot" style="background:#22c55e"></div>
        <span>Tier 1 — GNSS Active</span>
      </div>
      <div class="tier-item">
        <div class="tier-dot" style="background:#f59e0b"></div>
        <span>Tier 2 — Cellular RSSI</span>
      </div>
      <div class="tier-item">
        <div class="tier-dot" style="background:#ef4444"></div>
        <span>Tier 3 — Visual SLAM</span>
      </div>
    </div>
  </div>

  <script type="module" src="/src/main.ts"></script>
</body>
</html>
